# ByteLord VPS deployment for imap-spamfilter.
#
# Deployed location: /opt/bytelord/compose/imap-spamfilter/compose.yaml
# Source of truth:   imap-spamfilter/deploy/bytelord-compose.yaml
# Secrets:           /opt/bytelord/secrets/imap-spamfilter.env  (mode 600)
# Data:              /opt/bytelord/data/imap-spamfilter/  (redis, rspamd, state)
# Accounts:          /opt/bytelord/projects/imap-spamfilter/accounts.yml (gitignored)
# Repo checkout:     /opt/bytelord/projects/imap-spamfilter
#
# First-time setup:
#   bash /opt/bytelord/projects/imap-spamfilter/deploy/vps-bootstrap.sh
#   nano /opt/bytelord/projects/imap-spamfilter/accounts.yml
#   export SPAMFILTER_UID=$(id -u) SPAMFILTER_GID=$(id -g)
#   docker compose -f /opt/bytelord/compose/imap-spamfilter/compose.yaml up -d --build
#
# Secrets file keys (both required):
#   RSPAMD_PASSWORD=...     rspamd controller + filter auth
#   REDIS_PASSWORD=...      redis requirepass + rspamd redis client

x-logging: &log-rotate
  driver: json-file
  options:
    max-size: 50m
    max-file: "5"

x-secrets-file: &secrets-file /opt/bytelord/secrets/imap-spamfilter.env

services:
  spamfilter-redis:
    image: redis:8-alpine
    container_name: spamfilter-redis
    restart: unless-stopped
    logging: *log-rotate
    # uid 999 owns /data; the deploy group reads bootstrap-rendered mode-0640 config.
    user: "999:${SPAMFILTER_GID:-1001}"
    volumes:
      - /opt/bytelord/data/imap-spamfilter/redis:/data
      - /opt/bytelord/data/imap-spamfilter/redis-config:/usr/local/etc/redis:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks: [spamnet]

  spamfilter-unbound:
    image: mvance/unbound:1.22.0
    container_name: spamfilter-unbound
    restart: unless-stopped
    logging: *log-rotate
    networks: [spamnet]

  spamfilter-rspamd:
    image: rspamd/rspamd:4.2.0
    container_name: spamfilter-rspamd
    restart: unless-stopped
    logging: *log-rotate
    depends_on: [spamfilter-redis, spamfilter-unbound]
    group_add:
      - "${SPAMFILTER_GID:-1001}"
    volumes:
      - /opt/bytelord/data/imap-spamfilter/rspamd/local.d:/etc/rspamd/local.d:ro
      - /opt/bytelord/data/imap-spamfilter/rspamd/data:/var/lib/rspamd
    ports:
      # Rspamd's own WebUI lives on the controller port. Loopback-only;
      # Caddy (spam.bytelord.net/rspamd/ -> 127.0.0.1:11334) puts it on
      # NetBird. Does not weaken worker-controller.inc's password gate.
      - "127.0.0.1:11334:11334"
    networks: [spamnet]

  spamfilter:
    build:
      context: /opt/bytelord/projects/imap-spamfilter/filter
    image: ghcr.io/marcelverdult/imap-spamfilter:latest
    container_name: spamfilter
    restart: unless-stopped
    logging: *log-rotate
    # Time Docker waits after asking the filter to stop before killing it.
    # The default 10 s can cut a MOVE off before its database update is
    # written; account threads need up to ~30 s per step plus logout.
    stop_grace_period: 90s
    depends_on: [spamfilter-rspamd]
    # Note: do not use YAML aliases like "*secrets-file:/path:ro" — go-yaml
    # rejects alias+suffix in sequence items. Keep the path literal here.
    env_file:
      - /opt/bytelord/secrets/imap-spamfilter.env
    environment:
      SECRETS_FILE: /run/secrets/imap-spamfilter.env
      RSPAMD_SCAN_URL: http://spamfilter-rspamd:11333/checkv2
      RSPAMD_LEARN_URL: http://spamfilter-rspamd:11334
      # Shows a "Rspamd" link in the dashboard nav (opens in a new tab).
      # Requires the ports: mapping above on spamfilter-rspamd plus the
      # Caddy route in front of it. Rspamd's own login screen still gates
      # access - this is just a link, not a proxy or auto-login.
      RSPAMD_WEBUI_URL: https://spam.bytelord.net/rspamd/
      STATE_DIR: /state
      LOG_LEVEL: INFO
      # Dashboard times and per-day buckets use this zone. America/Los_Angeles
      # is US Pacific (covers WA) and switches PST/PDT automatically.
      TZ: America/Los_Angeles
    user: "${SPAMFILTER_UID:-1001}:${SPAMFILTER_GID:-1001}"
    volumes:
      - /opt/bytelord/secrets/imap-spamfilter.env:/run/secrets/imap-spamfilter.env:ro
      - /opt/bytelord/projects/imap-spamfilter/accounts.yml:/app/accounts.yml:ro
      - /opt/bytelord/data/imap-spamfilter/state:/state
    ports:
      - "127.0.0.1:8099:8099"
    networks: [spamnet]

networks:
  spamnet:
    # Shared with email-oauth2-proxy compose.
    external: true
    name: spamnet
