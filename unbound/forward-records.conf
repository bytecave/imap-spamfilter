# Mounted over the mvance/unbound image's default forward-records.conf.
#
# The image's default forwards every query ("." zone) over DNS-over-TLS to
# Cloudflare. Spamhaus, URIBL and SURBL refuse lookups that arrive through
# big public resolvers (Spamhaus answers 127.255.255.254), so rspamd's DNS
# blocklists scored nothing, and every sender and URL domain went to
# Cloudflare.
#
# This file is deliberately empty of forward-zone blocks: Unbound resolves
# from the root servers itself, which is what rspamd/local.d/options.inc
# expects ("recursive DNS so DNSBL lookups are not rate-limited").
#
# Check after a recreate (the first few queries can SERVFAIL while the cache
# warms up):
#   docker exec spamfilter-unbound drill 2.0.0.127.zen.spamhaus.org @127.0.0.1
#   -> 127.0.0.2, 127.0.0.4, 127.0.0.10 (Spamhaus's test entry)
# If it answers 127.255.255.254 instead, Spamhaus refuses this server's IP
# range and a free Spamhaus DQS key is needed.
