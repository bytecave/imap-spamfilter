# "Green Dot Bank" in Apple Cash footers is rewritten to the domain
# Green.Bank, which adds URL_OBFUSCATED_TEXT (+9) and pushes a real
# receipt over the junk threshold. Leave the other obfuscation patterns
# on: spaced "h t t p", hxxp, bracket dots, and HTML entities.
checks {
    obfuscated_text {
        patterns_enabled {
            word_dots = false;
        }
    }
}
