# Neural meta-classifier.
#
# autotrain = false (2026-09-25, OPUS-CR-004): rspamd's neural module
# normally teaches itself from rspamd's OWN score on every scan. On this
# IMAP path that score still includes the Microsoft auth-recheck noise the
# filter removes afterwards in Python (bucket B), so neural kept learning
# legitimate Amazon/Google/M365 mail as spam. With autotrain off it stores
# no new training data; after the rn_* Redis keys were deleted it has no
# model, so it contributes no NEURAL_* score until deliberately retrained.
enabled = true;
train {
    autotrain = false;
    max_trains = 1000;
    max_usages = 200;
    max_iterations = 25;
    learning_rate = 0.01;
    spam_score = 8;
    ham_score = -2;
}
symbol_spam = "NEURAL_SPAM";
symbol_ham = "NEURAL_HAM";
