# Bucket A — IMAP path has no SMTP client IP, so these fire on ham and spam
# alike. Zero them. Do not zero BROKEN_HEADERS or auth-failure symbols here.
symbols {
    "HFILTER_HOSTNAME_UNKNOWN" {
        weight = 0.0;
        description = "Unknown client hostname (ignored: IMAP scan has no client IP)";
    }
    "RDNS_NONE" {
        weight = 0.0;
        description = "No reverse DNS (ignored: IMAP scan has no client IP)";
    }
}
