# IMAP scans mail that has already been delivered. Rspamd greylist is an
# SMTP tempfail ("try again later"): the first message from a sender is
# scored, and a later message inside that window is returned unscored
# (score 0, action soft reject, only GREYLIST). The filter would treat
# that 0 as under rescue_below and move the message to the Inbox.
# There is no sending server to retry, so the module is off.
enabled = false;
