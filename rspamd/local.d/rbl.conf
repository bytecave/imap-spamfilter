# Realtime blocklists. Effective only when DNS goes through the in-stack
# Unbound resolving on its own (see options.inc and unbound/). Spamhaus and
# the URI blocklists refuse lookups relayed by public resolvers.
#
# IMAP scoring has no SMTP client IP, so a "from" check never fires; the
# "received" check walks the Received: chain in the message instead.
#
# Spamhaus ZEN and DBL, SURBL, URIBL, Mailspike, DNSWL and the rest come from
# rspamd's stock rbl module, with per-listing symbols (RBL_SPAMHAUS_SBL,
# RECEIVED_SPAMHAUS_XBL, ...) and calibrated scores. Do not add a second
# zen.spamhaus.org rule here: it would score the same listing twice and
# could not tell a spam-source listing from Spamhaus PBL (ordinary
# residential ranges).
#
# Abusix (combined.mail.abusix.zone) needs a per-account key prefix, e.g.
# "<key>.combined.mail.abusix.zone", and returns nothing without one. If a
# (free) Abusix Mail Intelligence key is ever set up, add a rule here and a
# weight in rbl_group.conf.
rbls {
    # Not in rspamd's stock list. Weighted in rbl_group.conf.
    spamcop {
        symbol = "RBL_SPAMCOP";
        rbl = "bl.spamcop.net";
        ipv4 = true;
        ipv6 = false;
        checks = ["received"];
    }
}
