# Community fuzzy hashes (rspamd.com, read-only): use rspamd's stock rule
# as shipped in /etc/rspamd/modules.d/fuzzy_check.conf.
#
# 2026-09-25 (OPUS-CR-029): this file used to override the stock
# "rspamd.com" rule with a made-up encryption_key (it contained "v", which
# is not in rspamd's zbase32 alphabet) and a hand-written server. rspamd
# logged "bad encryption key value" and silently dropped the rule, so
# fuzzy never scored anything. Do not override servers/encryption_key
# here: the stock rule finds servers via the _fuzzy._tcp.rspamd.com SRV
# record and carries rspamd's real public key.
