# Read-only community fuzzy storage. Verify the current public encryption key
# at https://rspamd.com/doc/modules/fuzzy_check.html before deploying.
rule "rspamd.com" {
    servers = "fuzzy.rspamd.com:11335";
    encryption_key = "VERIFY_AT_RSPAMD_DOCS_BEFORE_DEPLOY";
    symbol = "FUZZY_UNKNOWN";
    mime_types = ["*"];
    max_score = 12.0;
    read_only = true;
    skip_unknown = true;
    fuzzy_map = {
        FUZZY_DENIED  { max = 12; flag = 1; }
        FUZZY_PROB    { max = 5;  flag = 2; }
        FUZZY_WHITE   { max = 2;  flag = 3; }
    }
}
