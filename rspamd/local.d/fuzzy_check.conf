# Read-only community fuzzy storage. The encryption_key below is the
# published public key for fuzzy.rspamd.com (stable for years). If rspamd
# logs decryption errors, refresh from
# https://rspamd.com/doc/modules/fuzzy_check.html
rule "rspamd.com" {
    servers = "fuzzy.rspamd.com:11335";
    encryption_key = "ftcvm5dgbsjbkqonn5kshg9wbjm7am96e6gthebrro1k1tieuxby";
    symbol = "FUZZY_UNKNOWN";
    mime_types = ["*"];
    max_score = 12.0;
    read_only = true;
    skip_unknown = true;
    fuzzy_map = {
        FUZZY_DENIED  { max = 12; flag = 1; }
        FUZZY_PROB    { max = 5;  flag = 2; }
        FUZZY_WHITE   { max = 2;  flag = 3; }
    }
}
