# Per-recipient Bayes backed by Redis. autolearn explicitly disabled - we only
# learn from explicit user moves via the filter's /learnspam and /learnham calls.
#
# Do NOT set `expire` here. Any number (0 included) switches on rspamd's
# bayes_expiry module, and with 0 it runs `EXPIRE key 0` on infrequent and
# insignificant tokens every minute, which deletes them. Left unset, tokens
# never expire (stock rspamd behaviour), which is what this project wants.
backend = "redis";
new_schema = true;
autolearn = false;
users_enabled = true;
min_tokens = 11;
min_learns = 200;
