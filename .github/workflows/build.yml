name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Only rebuild the image when files that actually go into it change.
    # Tag pushes ignore this filter (release builds always run).
    paths:
      - 'filter/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'filter/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./filter
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: filter/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r filter/requirements.txt pytest
      - name: Syntax check
        run: |
          python -m compileall -q filter
      - name: Tests
        run: |
          cd filter && python -m pytest -q
      - name: YAML check
        run: |
          python -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('accounts.yml.example').read_text()); print('accounts.yml.example OK')"
      - name: XML check
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob('unraid/*.xml')):
              ET.parse(f); print(f, 'OK')
          PY

  # Keep the Actions history small: after a build, prune completed
  # runs down to the 4 most recent. The run doing the pruning is still
  # in progress (so not in the completed list); once it finishes the
  # history holds 5. Skipped on pull requests so a PR run never prunes
  # main's history.
  cleanup:
    needs: [filter, lint]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs (keep last 5)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
            --status completed --limit 1000 \
            --json databaseId --jq '.[].databaseId' \
            | tail -n +5 \
            | while read -r id; do
                echo "deleting run $id"
                gh run delete --repo "$GITHUB_REPOSITORY" "$id" || true
              done
