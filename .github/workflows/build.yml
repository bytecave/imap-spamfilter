name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Only rebuild the image when files that actually go into it change.
    # Tag pushes ignore this filter (release builds always run).
    paths:
      - 'filter/**'
      - '.github/workflows/build.yml'
      - 'accounts.yml.example'
      - '.env.example'
      - 'docker-compose.yml'
      - 'deploy/**'
      - 'unraid/**'
      - 'rspamd/**'
      - 'redis/**'
      - 'ca_profile.xml'
  pull_request:
    branches: [main]
    paths:
      - 'filter/**'
      - '.github/workflows/build.yml'
      - 'accounts.yml.example'
      - '.env.example'
      - 'docker-compose.yml'
      - 'deploy/**'
      - 'unraid/**'
      - 'rspamd/**'
      - 'redis/**'
      - 'ca_profile.xml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  filter:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./filter
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: filter/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r filter/requirements.txt pytest==8.4.2
          python -m pip check
      - name: Syntax check
        run: |
          python -m compileall -q filter
      - name: Tests
        run: |
          cd filter && python -m pytest -q
      - name: YAML check
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              Path("accounts.yml.example"),
              Path("docker-compose.yml"),
              *sorted(Path(".github/workflows").glob("*.yml")),
              *sorted(Path("deploy").glob("*.yaml")),
          ]
          for path in files:
              yaml.safe_load(path.read_text())
              print(path, "OK")
          PY
      - name: Compose check
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f deploy/bytelord-compose.yaml config --quiet --no-env-resolution
      - name: Shell syntax check
        run: bash -n deploy/*.sh unraid/*.sh
      - name: XML check
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = [*sorted(Path(".").glob("*.xml")), *sorted(Path("unraid").glob("*.xml"))]
          for path in files:
              ET.parse(path)
              print(path, "OK")
          PY

  # Exercise the newest interpreter without allowing a forward-compatibility
  # regression to publish an image or block the production Python 3.12 gate.
  forward-compatibility:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: filter/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r filter/requirements.txt pytest==8.4.2
      - name: Tests
        run: cd filter && python -m pytest -q

  # Keep the Actions history small: after a build, prune completed
  # runs down to the 4 most recent. The run doing the pruning is still
  # in progress (so not in the completed list); once it finishes the
  # history holds 5. Skipped on pull requests so a PR run never prunes
  # main's history.
  cleanup:
    needs: [filter, lint]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs (keep last 5)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
            --status completed --limit 1000 \
            --json databaseId --jq '.[].databaseId' \
            | tail -n +5 \
            | while read -r id; do
                echo "deleting run $id"
                gh run delete --repo "$GITHUB_REPOSITORY" "$id" || true
              done
